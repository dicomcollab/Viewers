name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - my-changes
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - my-changes

concurrency:
  group: azure-swa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    environment: viewer-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build viewer
        run: yarn build

      - name: Copy staticwebapp.config.json
        run: cp platform/app/staticwebapp.config.json platform/app/dist/

      - name: Install SWA CLI
        run: npm install -g @azure/static-web-apps-cli

      - name: Deploy to Azure Static Web Apps
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            swa deploy ./platform/app/dist --deployment-token ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }} --env production
          else
            swa deploy ./platform/app/dist --deployment-token ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          fi

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    environment: viewer-frontend
    steps:
      - name: Install SWA CLI
        run: npm install -g @azure/static-web-apps-cli

      - name: Close Pull Request
        run: swa deploy --action close --deployment-token ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
